# /etc/security/pwquality.conf  (lab 1, variant 14)
# Requirements close to the class 1G of the FSTEC guidance documents used in the course.
minlen = 8          # minimum length
dcredit = -1        # at least one digit
ucredit = -1        # at least one upper-case letter
lcredit = -1        # at least one lower-case letter
ocredit = 0         # special characters not required
difok = 3           # new password must differ from the old one in 3+ characters
retry = 3           # attempts before passwd gives up
enforce_for_root

# /etc/login.defs (password age)
# PASS_MAX_DAYS   90
# PASS_MIN_DAYS   1
# PASS_WARN_AGE   7
