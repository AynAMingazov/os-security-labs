# /etc/rsyslog.d/50-security.conf  (lab 1)
# Authentication events to a separate file, everything with priority info and above to /tmp/messages.
auth,authpriv.*        /var/log/security1
*.info;mail.none       /tmp/messages

# apply:  sudo systemctl restart rsyslog
# check:  logger -p auth.notice "test auth event" && sudo tail -n 3 /var/log/security1
